{% extends "base.html" %}
{% comment %}Layout for platform staff pages: a simple top bar and the page.{% endcomment %}
{% block body %}
  <header class="platform-bar">
    <a href="{% url 'platformadmin:gym_list' %}"><strong>Gym Business OS · Platform</strong></a>
    <nav>
      <a href="{% url 'platformadmin:gym_list' %}">Gyms</a>
      <a href="{% url 'admin:index' %}">Database admin</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">{% csrf_token %}<button type="submit" class="link-button">Sign out</button></form>
    </nav>
  </header>
  <main class="content stack-lg platform-main">
    {% include "components/messages.html" %}
    {% block content %}{% endblock %}
  </main>
{% endblock %}
