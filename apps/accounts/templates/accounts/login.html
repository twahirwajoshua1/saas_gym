{% extends "base.html" %}
{% block title %}Sign in · Gym Business OS{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <p role="alert"><strong>{{ form.non_field_errors.0 }}</strong></p>
    {% endif %}
    <p>
      <label for="{{ form.phone.id_for_label }}">Phone number</label><br>
      {{ form.phone }}
    </p>
    <p>
      <label for="{{ form.password.id_for_label }}">Password</label><br>
      {{ form.password }}
    </p>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
